spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

        - id: driver-assignment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/drivers/**

        - id: location-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/locations/**

server:
  port: 8080