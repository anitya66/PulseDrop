spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**

            - id: driver-assignment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/drivers/**

            - id: location-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/locations/**

            # Notification WebSocket
            # Must be evaluated before the general /ws/** route
            - id: notification-websocket
              uri: ws://localhost:8085
              order: -1
              predicates:
                - Path=/ws/notifications

            # Location WebSocket
            - id: location-websocket
              uri: ws://localhost:8084
              order: 0
              predicates:
                - Path=/ws/**

server:
  port: 8080

management:
  endpoint:
    gateway:
      access: read-only

  endpoints:
    web:
      exposure:
        include: health,gateway

jwt:
  secret: ${JWT_SECRET}